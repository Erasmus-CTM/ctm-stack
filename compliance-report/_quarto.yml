project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - port-regressions.qmd
    - semantics.qmd
  resources:
    - report.json
    - port-regressions.json
    - report-ui.js
    - report.js
    - port-regressions.js
    - report.css

website:
  title: "STACK SymPy"
  navbar:
    background: light
    logo-href: ../
    left:
      - text: STACK compliance
        href: index.qmd
      - text: Port regressions
        href: port-regressions.qmd
      - text: Semantics for STACK authors
        href: semantics.qmd
      - text: Teacher guides
        menu:
          - text: Authoring
            href: ../docs/authoring.html
          - text: Matrix input
            href: ../docs/matrix-input.html
          - text: Python answer tests and SPD
            href: ../docs/python-checker-api.html
    right:
      - text: Back to examples
        icon: arrow-left
        href: ../

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    css: report.css
    html-math-method: mathjax

