name: Native STACK compliance report

on:
  push:
    branches: [main, 'feature/**']
    paths:
      - '.github/workflows/native-compliance.yml'
      - '_quarto.yml'
      - '_extensions/stack-sympy/**'
      - 'scripts/import_stack_fixtures.py'
      - 'scripts/native_compliance/**'
      - 'scripts/run_compliance_*.py'
      - 'tests/native_compliance/**'
      - 'tests/test_compliance_*.py'
      - 'tests/test_fixture_import.py'
      - 'compliance-report/**'
      - 'requirements*.txt'
  pull_request:
    paths:
      - '.github/workflows/native-compliance.yml'
      - '_quarto.yml'
      - '_extensions/stack-sympy/**'
      - 'scripts/import_stack_fixtures.py'
      - 'scripts/native_compliance/**'
      - 'scripts/run_compliance_*.py'
      - 'tests/native_compliance/**'
      - 'tests/test_compliance_*.py'
      - 'tests/test_fixture_import.py'
      - 'compliance-report/**'
      - 'requirements*.txt'

permissions:
  contents: read

jobs:
  desired:
    name: Python vs authored desired outcomes
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/run_compliance_python.py --jobs 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compliance-python
          path: test-results/compliance/python.json
          if-no-files-found: warn

  native:
    name: Observe official STACK/Maxima
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: maths/moodle-qtype_stack
          ref: 10d323311b7f39fb7b092dd10ce75f7d8632f525
          path: .stack-upstream-reference
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned SymPy and native Maxima
        run: |
          sudo apt-get update
          sudo apt-get install -y maxima maxima-share
          python -m pip install -r requirements.txt
      - name: Verify imported rows against exact upstream bytes
        run: python scripts/import_stack_fixtures.py --upstream .stack-upstream-reference --check
      - run: python scripts/run_compliance_maxima.py --stack-source .stack-upstream-reference
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compliance-maxima
          path: test-results/compliance/maxima.json
          if-no-files-found: warn

  reference:
    name: Compare Python with native STACK
    needs: [desired, native]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download this run's Python observations
        uses: actions/download-artifact@v4
        with:
          name: compliance-python
          path: test-results/compliance
      - name: Download this run's Maxima observations
        uses: actions/download-artifact@v4
        with:
          name: compliance-maxima
          path: test-results/compliance
      - run: python scripts/native_compliance/compatibility.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compliance-reference
          path: test-results/compliance/reference.json
          if-no-files-found: warn

  parity:
    name: Pyodide vs CPython
    needs: desired
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Download this run's Python observations
        uses: actions/download-artifact@v4
        with:
          name: compliance-python
          path: test-results/compliance
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/run_compliance_pyodide.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compliance-pyodide
          path: test-results/compliance/pyodide.json
          if-no-files-found: warn

  report:
    name: Assemble and render inspectable report
    needs: [desired, native, reference, parity]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.8.27
      - name: Download only this workflow run's checker outputs
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: compliance-*
          merge-multiple: true
          path: test-results/compliance
      - name: Assemble report (missing or mismatched checks remain unavailable)
        run: python scripts/native_compliance/report.py
      - name: Render independent Quarto project
        run: quarto render compliance-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-compliance-json
          path: compliance-report/report.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-compliance-html
          path: compliance-report/_site/
          if-no-files-found: warn

  publish:
    name: Publish main report independently
    needs: report
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.report.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: stack-sympy-pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: native-compliance-html
          path: ./report-site
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./report-site
          publish_branch: gh-pages
          destination_dir: compliance
          keep_files: true
