name: Native STACK compliance report

on:
  workflow_call:

permissions:
  contents: read

jobs:
  desired:
    name: Python vs authored desired outcomes
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/run_compliance_python.py --jobs 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compliance-python
          path: test-results/compliance/python.json
          if-no-files-found: warn

  native:
    name: Observe official STACK/Maxima
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: maths/moodle-qtype_stack
          ref: 10d323311b7f39fb7b092dd10ce75f7d8632f525
          path: .stack-upstream-reference
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned SymPy and native Maxima
        run: |
          sudo apt-get update
          sudo apt-get install -y maxima maxima-share
          python -m pip install -r requirements.txt
      - name: Verify imported rows against exact upstream bytes
        run: python scripts/import_stack_fixtures.py --upstream .stack-upstream-reference --check
      - name: Probe standalone official Maxima loader
        run: python scripts/run_compliance_maxima.py --stack-source .stack-upstream-reference --probe-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maxima-loader-probe
          path: test-results/compliance/maxima-loader-probe.json
          if-no-files-found: warn
      - run: python scripts/run_compliance_maxima.py --stack-source .stack-upstream-reference
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compliance-maxima
          path: test-results/compliance/maxima.json
          if-no-files-found: warn

  reference:
    name: Compare Python with native STACK
    needs: [desired, native]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download this run's Python observations
        uses: actions/download-artifact@v4
        with:
          name: compliance-python
          path: test-results/compliance
      - name: Download this run's Maxima observations
        uses: actions/download-artifact@v4
        with:
          name: compliance-maxima
          path: test-results/compliance
      - run: python scripts/native_compliance/compatibility.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compliance-reference
          path: test-results/compliance/reference.json
          if-no-files-found: warn

  parity:
    name: Pyodide vs CPython
    needs: desired
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Download this run's Python observations
        uses: actions/download-artifact@v4
        with:
          name: compliance-python
          path: test-results/compliance
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/run_compliance_pyodide.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compliance-pyodide
          path: test-results/compliance/pyodide.json
          if-no-files-found: warn

  port-regressions:
    name: Project regressions (Python, Maxima, Pyodide)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: maths/moodle-qtype_stack
          ref: 10d323311b7f39fb7b092dd10ce75f7d8632f525
          path: .stack-upstream-reference
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          sudo apt-get update
          sudo apt-get install -y maxima maxima-share
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - run: python scripts/run_port_regressions.py --stack-source .stack-upstream-reference
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compliance-port-regressions
          path: test-results/compliance/port-regressions.json
          if-no-files-found: warn

  report:
    name: Assemble and render inspectable report
    needs: [desired, native, reference, parity, port-regressions]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.8.27
      - name: Download only this workflow run's checker outputs
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: compliance-*
          merge-multiple: true
          path: test-results/compliance
      - name: Assemble report (missing or mismatched checks remain unavailable)
        run: python scripts/native_compliance/report.py
      - name: Render independent Quarto project
        run: quarto render compliance-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-compliance-json
          path: |
            compliance-report/report.json
            compliance-report/port-regressions.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-compliance-html
          path: compliance-report/_site/
          if-no-files-found: warn

