name: Test and publish Quarto site

on:
  push:
    branches: [main, 'feature/**']
    paths-ignore:
      - 'docs/audits/**'
  pull_request:
    paths-ignore:
      - 'docs/audits/**'

permissions:
  contents: read

jobs:
  # The commits this run builds against: .github/pins.json, or for review the
  # head commit's CTM-Review-Refs trailer.
  dependencies:
    name: CTM Assessment commits (pins, review refs)
    runs-on: ubuntu-24.04
    outputs:
      ctm-checkers: ${{ steps.refs.outputs.ctm-checkers }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: refs
        uses: ./.github/actions/ctm-dependencies
        with:
          install: 'false'
      - name: The compliance job calls the workflow of that ctm-checkers commit
        env:
          CHECKERS: ${{ steps.refs.outputs.ctm-checkers }}
        run: |
          used=$(grep -oE 'ctm-checkers/\.github/workflows/native-stack\.yml@[0-9a-f]{40}' .github/workflows/site.yml | cut -d@ -f2)
          test "$used" = "$CHECKERS" || {
            echo "::error file=.github/workflows/site.yml::the compliance job calls native-stack.yml@$used, but this run builds against ctm-checkers $CHECKERS: use that commit in its uses line"; exit 1; }

  # STACK's engine against native STACK and in the browser, and the compliance
  # report published under /compliance: ctm-checkers' workflow at the commit
  # this site builds against (it includes the reference cases against native
  # STACK answer tests that this workflow ran before).
  compliance:
    name: Native STACK (ctm-checkers)
    needs: dependencies
    uses: Erasmus-CTM/ctm-checkers/.github/workflows/native-stack.yml@29f8ebc56e42f8d22c1c0e257f425117a5f45ce6 # the ctm-checkers commit this run builds against (checked above)
    with:
      ctm-checkers-ref: ${{ needs.dependencies.outputs.ctm-checkers }}

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.8.27
      - name: Install ctm-libs and ctm-checkers (pins, review refs)
        uses: ./.github/actions/ctm-dependencies
      - run: pip install -r requirements-dev.txt
      - run: python scripts/fetch-examples.py
      - run: python -m pytest -q tests
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests/browser.py tests/feedback_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-ui-example
          path: test-results/example.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: site-html
          path: _site/
          if-no-files-found: error

  publish:
    name: Publish tested site and compliance report together
    needs: [site, compliance]
    if: github.event_name == 'push' && needs.site.result == 'success' && needs.compliance.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: stack-sympy-pages
      cancel-in-progress: false
    steps:
      - name: Check branch head under publication lock
        id: head
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace(/^refs\/heads\//, '');
            const {data} = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${branch}`
            });
            const current = data.object.sha === context.sha;
            core.info(current ? `Publishing current commit ${context.sha}` :
              `Skipping stale commit ${context.sha}; branch is now ${data.object.sha}`);
            core.setOutput('current', String(current));
      - name: Download tested site
        if: steps.head.outputs.current == 'true'
        uses: actions/download-artifact@v4
        with:
          name: site-html
          path: ./publish-site
      - name: Add matching compliance report
        if: steps.head.outputs.current == 'true'
        uses: actions/download-artifact@v4
        with:
          name: native-compliance-html
          path: ./publish-site/compliance
      - name: Publish main site and feature previews
        if: steps.head.outputs.current == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish-site
          publish_branch: gh-pages
          destination_dir: ${{ github.ref == 'refs/heads/main' && '.' || format('previews/{0}', github.ref_name) }}
          keep_files: true
