project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - examples.qmd
    - corpus.qmd
    - docs/authoring.qmd
  resources:
    - questions/**

website:
  title: "STACK SymPy"
  navbar:
    left:
      - href: index.qmd
        text: Try it
      - href: examples.qmd
        text: More examples
      - href: corpus.qmd
        text: Question corpus
      - href: docs/authoring.qmd
        text: Authoring guide
      - href: compliance/
        text: Native compliance
    right:
      - icon: github
        href: https://github.com/Erasmus-CTM/stack-sympy
        aria-label: Source repository
  page-footer:
    left: "STACK SymPy · a bounded, inspectable STACK subset for static Quarto pages"

format:
  html:
    theme: cosmo
    toc: true
    html-math-method: mathjax
    code-copy: true

filters:
  - stack-sympy

ai-feedback:
  policy-files: feedback/course.yml
  project-policy:
    math-exercise: course-mathematics
