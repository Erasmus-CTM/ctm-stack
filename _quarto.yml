project:
  type: website
  output-dir: _site
  # The STACK examples of the pinned ctm-checkers (git-ignored questions/).
  pre-render: scripts/fetch-examples.py
  render:
    - index.qmd
    - examples.qmd
    - corpus.qmd
    - docs/authoring.qmd
    - docs/python-answer-tests.qmd
    - docs/python-checker-api.qmd
    - docs/matrix-input.qmd
  resources:
    - questions/**

website:
  title: "STACK SymPy"
  navbar:
    left:
      - href: index.qmd
        text: Try it
      - href: examples.qmd
        text: Worked questions
      - href: corpus.qmd
        text: Question corpus
      - text: Authoring
        menu:
          - href: docs/authoring.qmd
            text: Teacher guide
          - href: docs/matrix-input.qmd
            text: Matrix input and grading
          - href: docs/python-checker-api.qmd#author-the-spd-checker
            text: Positive-definiteness checker walkthrough
          - href: docs/authoring.qmd#for-developers
            text: Developer reference
      - href: docs/python-checker-api.qmd
        text: Python answer tests
      - text: Compatibility
        menu:
          - href: compliance/
            text: STACK compliance
          - href: compliance/port-regressions.html
            text: Port regressions
          - href: compliance/semantics.html
            text: Semantics for STACK authors
    right:
      - icon: github
        href: https://github.com/Erasmus-CTM/stack-sympy
        aria-label: Source repository
  page-footer:
    left: "STACK SymPy · interactive practice for Quarto teaching pages"

format:
  html:
    theme: cosmo
    toc: true
    html-math-method: mathjax
    code-copy: true

filters:
  - stack-sympy

ai-feedback:
  policy-files: feedback/course.yml
  project-policy:
    math-exercise: course-mathematics
