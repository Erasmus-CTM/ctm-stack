project:
  type: website
  output-dir: _site
  # The STACK examples of the pinned ctm-checkers (git-ignored questions/).
  pre-render: scripts/fetch-examples.py
  render:
    - index.qmd
    - examples.qmd
    - corpus.qmd
    - docs/authoring.qmd
    - docs/backend-contract.qmd
    - docs/native-authoring.qmd
    - docs/python-answer-tests.qmd
    - docs/python-checker-api.qmd
    - docs/matrix-input.qmd
  resources:
    - questions/**
    - docs/audits/upstream-compiler-2026-10-27.md
    - docs/audits/upstream-compiler-2026-10-27/**

website:
  title: "CTM STACK"
  navbar:
    left:
      - href: index.qmd
        text: Try it
      - href: examples.qmd
        text: Worked questions
      - href: corpus.qmd
        text: Question corpus
      - text: Authoring
        menu:
          - href: docs/authoring.qmd
            text: Teacher guide
          - href: docs/matrix-input.qmd
            text: Matrix input and grading
          - href: docs/native-authoring.qmd
            text: Native runtime-v3 authoring
          - href: docs/python-checker-api.qmd#symmetric-positive-definite-matrices
            text: Positive-definiteness checks
          - href: docs/authoring.qmd#for-developers
            text: Developer reference
      - href: docs/python-checker-api.qmd
        text: Python answer tests
      - text: Compatibility
        menu:
          - href: compliance/
            text: STACK compliance
          - href: compliance/port-regressions.html
            text: Port regressions
          - href: compliance/semantics.html
            text: Semantics for STACK authors
    right:
      - icon: github
        href: https://github.com/Erasmus-CTM/ctm-stack
        aria-label: Source repository
  page-footer:
    left: "CTM STACK · interactive practice for Quarto teaching pages"

format:
  html:
    theme: cosmo
    toc: true
    html-math-method: mathjax
    code-copy: true

filters:
  - ctm-stack

ai-feedback:
  policy-files: feedback/course.yml
  policy:
    stack: course-mathematics

stack:
  source-panels: true
