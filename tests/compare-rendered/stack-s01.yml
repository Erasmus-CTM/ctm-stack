# Expected differences of S4 (consolidation step 2, the stack-sympy audit's
# S-01): this site rendered at stack-sympy main 0067141 (ctm-checkers 0.2.0,
# 8c3db5e) against the site rendered at S4 (ctm-checkers 0.3.0). The cards,
# their variants and question tests do not change: S-01 changes what the
# engine does with a learner's answer in the browser (validation), not what
# the build writes; tests/browser.py checks it. Run with the umbrella's
