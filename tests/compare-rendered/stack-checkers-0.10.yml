        line: '^text: to answers that are not numbers or not of the teacher’s type, and treats an answer a test cannot decide as false, below\), Python 3\.9\+, SymPy 1\.13\.3, Quarto 1\.8\.27\+ and HTML output with JavaScript\. Set$'
