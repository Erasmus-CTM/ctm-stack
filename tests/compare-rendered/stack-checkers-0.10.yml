# Expected differences of this site's pin of ctm-checkers 0.10.0 (consolidation
# step 2, the STACK set S-07, S-05, S-10 and S-11): the site rendered at
# stack-sympy main 1b1d50f (ctm-checkers 0.6.0, c366f17) against the site
# rendered at this pull request's head (ctm-checkers 0.10.0). The cards, their
# question tests and the variants do not change: the example questions are the
# same files (the changes of ctm-checkers 0.7.0 to 0.10.0 are in the engine and
# in its probe and supplement questions, which this site does not copy), and
# what the engine does with a learner's answer in the browser is not written by
# the build. Only the authoring guide's prose changes, by section and words.
# Run with the umbrella's tools/compare-rendered.mjs (ctm-assessment):
#
#   node tools/compare-rendered.mjs --before <1b1d50f>/_site --after <head>/_site \
#     --expect <stack-sympy>/tests/compare-rendered/stack-checkers-0.10.yml
categories:
  - id: docs-requirements
    title: The requirements name ctm-checkers 0.10.0 (question options, answers that are not numbers or not of the teacher’s type, answers a test cannot decide)
    match:
      - {area: dom, page: '^docs/authoring\.html$', change: '^(added|text changed)$', ancestors: 'section#question-block-options\b'}
  - id: docs-question-options-and-checkanswertype
    title: The XML reference names the question options the engine reads, and the input checkanswertype (S-07, S-10)
    match:
      - {area: dom, page: '^docs/authoring\.html$', change: '^(added|text changed)$', ancestors: 'section#input-and-xml-reference\b'}
  - id: docs-numerical-tests
    title: The numerical tests are false for an answer that is not a number (S-05)
    match:
      - {area: dom, page: '^docs/authoring\.html$', change: '^(added|text changed)$', ancestors: 'section#answer-entry-and-form\b'}
  - id: docs-same-type-and-undecided
    title: SameType decides equations and logical expressions, and an answer a test cannot decide is false (S-10, S-11)
    match:
      - {area: dom, page: '^docs/authoring\.html$', change: '^(added|text changed)$', ancestors: 'section#lists-sets-and-equations\b'}
